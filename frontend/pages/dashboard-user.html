<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>
  <link rel="stylesheet" href="../css/dashboard-user.css">
</head>

<body>
  <div class="dashboard-container">

    <!-- Top bar with logout -->
    <div class="top-bar">
      <h1 class="dashboard-title">User Dashboard</h1>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>

    <!-- User Info Card -->
    <div class="user-card">
      <h2>Welcome, <span id="userName">Loading...</span></h2>
      <div class="user-info">
        <div class="info-row"><span>Email:</span> <span id="userEmail">Loading...</span></div>
        <div class="info-row"><span>Phone Number:</span> <span id="userPhone">Loading...</span></div>
        <div class="info-row"><span>Account Status:</span> <span id="accountStatus">Loading...</span></div>
        <div class="info-row"><span>KYC Status:</span> <span id="kycStatus">Loading...</span></div>
      </div>

      <!-- Wallet Summary Boxes -->
      <div class="wallet-summary">
        <div class="wallet-box">
          <h3>Available Balance</h3>
          <p id="availableAmount">Loading...</p>
        </div>
        <div class="wallet-box pending">
          <h3>Pending Balance</h3>
          <p id="pendingAmount">Loading...</p>
        </div>
      </div>

      <div class="send-to-wallet">
        <h2>Send To Wallet</h2>
        <form id="send-wallet-box">
          <input type="email" id="receiverEmail" placeholder="Receiver Email" required>
          <label for="totalAmt">Total Amount</label>
          <input 
            type="number" 
            id="totalAmt" 
            name="totalAmt" 
            step="0.01" 
            min="0" 
            inputmode="decimal"
            placeholder="0.00"
            aria-label="Total Amount in dollars">          
          <button type="submit">Send</button>
        </form>
      </div>

    </div>

  </div>

  <script src="../js/dashboard-user.js"></script>
</body>

</html>
