<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard-admin.css">
</head>

<body>
<div class="dashboard-container">

    <div class="top-bar">
        <h1 class="dashboard-title">Admin Dashboard</h1>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>

    <!-- Adjustment Section -->
    <section class="section">
        <h2>Wallet Adjustment</h2>
        <form id="send-wallet-box">
            <input type="email" id="receiverEmail" placeholder="Receiver Email" required>
            <label for="totalAmt">Total Amount</label>
            <input type="number" id="totalAmt" step="0.01" placeholder="0.00">
            <button type="submit">Send</button>
        </form>
    </section>

    <!-- Users Section -->
    <section class="section">
        <h2>All Users</h2>
        <div id="usersList"></div>
    </section>


    <!-- Transactions -->
    <section class="section">
        <h2>All Transactions</h2>
        <div id="transactionTableWrapper"></div>
    </section>

</div>

<script src="../js/dashboard-admin.js"></script>
</body>
</html>
